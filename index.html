<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173c32">
  <meta name="description" content="FBTI 飞盘人格测试：红姐原版 30 道场景题，少量初阶选项，原版人格图，以及从场上选择推断的实力范围。">
  <title>FBTI 飞盘人格测试 · 从场景发现你的盘场人格</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header shell">
    <a href="./" class="brand" aria-label="FBTI 首页"><span class="brand-disc">◎</span> FBTI<span class="brand-note">飞盘人格实验室</span></a>
    <button class="text-button" id="about-button">玩法说明 ↗</button>
  </header>
  <main id="app" class="shell" aria-busy="true">
    <div class="loading">正在把飞盘和题目送过来…</div>
  </main>
  <footer class="site-footer shell">
    <span>每一种队友，都有自己的主场。</span>
    <span>原作 <a href="https://github.com/leishaforlinminzhi-9/FBTI" target="_blank" rel="noopener">RED / 红姐</a> · 改编 <a href="https://github.com/wch1007/FBTI-Revised-Version" target="_blank" rel="noopener">wch1007</a></span>
  </footer>
  <dialog id="about-dialog">
    <div class="dialog-top"><span class="eyebrow">FIELD NOTES / 玩法说明</span><button id="close-about" class="round-button" aria-label="关闭说明">×</button></div>
    <h2>30 个场景，照平时的你来。</h2>
    <p>沿用红姐原版 30 个场景，加上更多盘友的真实反应。按平时的习惯选择，领取你的人格图和实力趣味预判。</p>
    <p>从 L0 小白到 L9 国家队级，上下浮动最多 2 级，以报告的参考范围为准。人格和等级仅供娱乐，真正的实力，场上见。</p>
    <p>偶尔还有隐藏人设出没，看看你能不能遇到。</p>
    <p class="muted">不用注册。答案仅保存在当前浏览器，可随时清除。</p>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="shell">这个测试需要启用 JavaScript 才能计算结果。启用后刷新即可。</p></noscript>
</body>
</html>
